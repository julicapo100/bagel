<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101315;
    --bezel: #1c1f21;
    --bezel-light: #2b2f32;
    --bezel-dark: #0a0b0c;
    --screen: #0c1f22;
    --screen-top: #143036;
    --ink: #8fe6d8;
    --ink-dim: #5aa89c;
    --ink-glow: rgba(120, 240, 220, 0.55);
    --font: 'VT323', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: none;
  }

  /* fondo: pared / mesa oscura tipo comic */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 40%, #22272a 0%, #111416 55%, #070809 100%);
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.12) 0 2px, transparent 2px 7px);
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 0;
  }

  .stage {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4vmin;
  }

  /* MONITOR */
  .monitor {
    position: relative;
    width: min(92vw, 150vh);
    aspect-ratio: 4 / 3;
    max-height: 92vh;
    background: linear-gradient(160deg, var(--bezel-light) 0%, var(--bezel) 40%, var(--bezel-dark) 100%);
    border-radius: 14px;
    padding: 5.5%;
    box-shadow:
      0 0 0 3px #050606,
      0 30px 80px rgba(0,0,0,0.85),
      inset 0 2px 0 rgba(255,255,255,0.06),
      inset 0 -3px 0 rgba(0,0,0,0.7);
  }
  /* desgaste/grunge del bisel */
  .monitor::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background:
      radial-gradient(circle at 8% 10%, rgba(255,255,255,0.07), transparent 25%),
      radial-gradient(circle at 92% 88%, rgba(0,0,0,0.5), transparent 30%),
      repeating-linear-gradient(35deg, rgba(0,0,0,0.08) 0 3px, transparent 3px 11px);
    pointer-events: none;
  }
  /* marco interior negro */
  .monitor::after {
    content: "";
    position: absolute;
    inset: 4%;
    border-radius: 8px;
    border: 2px solid #050606;
    box-shadow:
      inset 0 0 0 6px #0e1012,
      inset 0 0 0 8px #1f2326,
      0 0 0 2px rgba(255,255,255,0.03);
    pointer-events: none;
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    background:
      radial-gradient(ellipse at 50% 0%, var(--screen-top) 0%, var(--screen) 55%, #061214 100%);
    border-radius: 6px / 8px;
    overflow: hidden;
    cursor: text;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.9),
      inset 0 0 6px rgba(140,230,215,0.15);
    z-index: 1;
  }
  /* scanlines */
  .screen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.28) 0px,
      rgba(0,0,0,0.28) 1px,
      transparent 1px,
      transparent 4px
    );
    pointer-events: none;
    z-index: 3;
  }
  /* viñeta + brillo */
  .screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.6) 100%),
      linear-gradient(180deg, rgba(255,255,255,0.05) 0%, transparent 18%);
    pointer-events: none;
    z-index: 4;
  }

  /* leve parpadeo del tubo */
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.92; }
    94% { opacity: 1; }
    97% { opacity: 0.96; }
  }
  .content {
    position: absolute;
    inset: 0;
    z-index: 2;
    animation: flicker 6s infinite;
    text-shadow: 0 0 6px var(--ink-glow), 0 0 2px var(--ink);
    letter-spacing: 0.06em;
    font-size: clamp(16px, 2.6vw, 30px);
    line-height: 1.35;
    text-transform: uppercase;
  }

  /* ---------- VISTA PASSWORD ---------- */
  .view { position: absolute; inset: 0; display: none; }
  .view.active { display: block; }

  .pw-title {
    position: absolute;
    top: 21%;
    left: 0; right: 0;
    text-align: center;
    font-weight: bold;
  }

  .pw-input {
    position: absolute;
    top: 38%;
    left: 0; right: 0;
    text-align: center;
    min-height: 1.4em;
  }
  .pw-input .arrow { display: block; font-size: 0.55em; line-height: 1; color: var(--ink-dim); }
  .pw-input .typed {
    text-transform: none;
    display: inline-block;
    min-width: 1ch;
    margin: 0.1em 0;
  }
  .caret {
    display: inline-block;
    width: 0.6ch;
    height: 0.9em;
    background: var(--ink);
    vertical-align: -0.1em;
    margin-left: 2px;
    animation: blink 1s steps(1) infinite;
    box-shadow: 0 0 6px var(--ink-glow);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .pw-status {
    position: absolute;
    top: 56%;
    left: 0; right: 0;
    text-align: center;
    color: #e08a7a;
    text-shadow: 0 0 6px rgba(240,120,100,0.6);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .pw-status.show { opacity: 1; }

  .pw-hint {
    position: absolute;
    top: 74%;
    left: 0; right: 0;
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.75em;
  }
  .pw-hint.tap { cursor: pointer; }


  /* ---------- MENÚ ---------- */
  .menu-title {
    position: absolute;
    top: 21%;
    left: 0; right: 0;
    text-align: center;
    font-weight: bold;
  }
  .menu-list {
    position: absolute;
    top: 40%;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5em;
  }
  .opt { cursor: pointer; padding: 0 0.6ch; }
  .opt.sel { background: var(--ink); color: var(--screen); text-shadow: none; }

  /* ---------- HISTORIAL ---------- */
  #hist-body { white-space: normal; }
  .hist-list { display: flex; flex-direction: column; align-items: flex-start; gap: 0.3em; }
  .hist-list > div { display: flex; }
  .hist-num { color: var(--ink-dim); margin-right: 1ch; flex: none; }
  .opt.sel .hist-num { color: var(--screen); }
  .opt.secret, .opt.secret .hist-num { color: #f0a868; text-shadow: 0 0 6px rgba(240,150,80,0.6), 0 0 2px #f0a868; }
  .opt.secret { margin-top: 0.6em; }
  .opt.secret.sel { background: #f0a868; }
  .opt.secret.sel, .opt.secret.sel .hist-num { color: var(--screen); text-shadow: none; }
  .hist-locked { color: var(--ink-dim); padding: 0 0.6ch; opacity: 0.6; }

  /* ---------- VISTA TEXTO ---------- */
  .txt-body {
    position: absolute;
    inset: 9% 9% 14% 9%;
    overflow-y: auto;
    white-space: pre-wrap;
    font-size: 0.9em;
    text-transform: none;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-dim) transparent;
  }
  .txt-body::-webkit-scrollbar { width: 6px; }
  .txt-body::-webkit-scrollbar-thumb { background: var(--ink-dim); }
  .txt-body h1 {
    font-size: 1.15em;
    margin: 0 0 0.6em;
    text-transform: uppercase;
    font-weight: bold;
  }
  .log { display: grid; grid-template-columns: auto auto 1fr; column-gap: 1.2ch; row-gap: 0.35em; }
  .log-row { display: contents; }
  .log-time { color: var(--ink-dim); white-space: nowrap; }
  .log-who  { font-weight: bold; white-space: nowrap; text-transform: uppercase; }
  .log-msg  { white-space: pre-wrap; }
  /* collage de recortes */
  .clips { display: flex; flex-direction: column; gap: 1.2em; padding: 0.4em 0.5em 1em; }
  .clip {
    border: 1px solid var(--ink-dim);
    padding: 0.6em 0.8em;
    white-space: pre-wrap;
    transform: rotate(var(--r, 0deg));
    animation: clipin 0.25s ease-out;
  }
  @keyframes clipin { from { opacity: 0; transform: rotate(var(--r, 0deg)) translateY(8px); } }
  .clip-src { font-size: 0.7em; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5em; }
  .clip-head { font-size: 1.25em; font-weight: bold; text-transform: uppercase; line-height: 1.1; margin-bottom: 0.4em; }
  .clip.revista { border-width: 0 0 0 4px; }
  .clip.nota    { border-style: dashed; font-style: italic; }
  .clip.aviso   { border: 3px double var(--ink); text-align: center; }
  .clip.bando   { border-width: 2px 0; text-align: center; text-transform: uppercase; }
  .clip.menu    { border-style: dotted; }
  .clip.aviso .clip-src, .clip.bando .clip-src { text-align: center; }
  .txt-img {
    display: block;
    margin: 1em auto 0;
    width: min(60%, 320px);
    image-rendering: pixelated;
    opacity: 0.9;
    filter: drop-shadow(0 0 8px var(--ink-glow));
  }
  .txt-hint {
    position: absolute;
    bottom: 5%;
    left: 0; right: 0;
    text-align: center;
    color: var(--ink-dim);
    font-size: 0.75em;
    cursor: pointer;
    z-index: 5;
  }

  /* textos de ayuda: teclado en compu, solo "tap" en pantallas táctiles */
  .touch { display: none; }
  @media (hover: none) {
    .kb { display: none; }
    .touch { display: inline; }
    .opt { padding: 0.15em 0.6ch; }
  }

  /* celular vertical: monitor más alto para que entre el texto */
  @media (orientation: portrait) {
    .monitor { aspect-ratio: 3 / 4; width: 94vw; padding: 6%; }
    .content { font-size: clamp(16px, 4.6vw, 30px); }
    .txt-body { inset: 8% 7% 13% 7%; }
  }

  /* input real, invisible, captura teclado.
     Dentro de la pantalla (no fuera de ella) y a 16px para que iOS no haga zoom ni scroll. */
  #pw-form { margin: 0; }
  #hidden {
    position: fixed;
    top: 0; left: 0;
    opacity: 0;
    width: 1px; height: 1px;
    font-size: 16px;
    border: 0; padding: 0;
    pointer-events: none;
  }

  /* efecto encendido */
  @keyframes turnon {
    0% { transform: scaleY(0.005) scaleX(0.6); filter: brightness(6); }
    40% { transform: scaleY(0.005) scaleX(1); filter: brightness(6); }
    70% { transform: scale(1); filter: brightness(2); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  .screen { animation: turnon 0.9s ease-out; }

  /* glitch al cambiar de vista */
  @keyframes glitch {
    0% { transform: translateX(0); filter: brightness(1); }
    20% { transform: translateX(-6px) skewX(4deg); filter: brightness(1.8); }
    40% { transform: translateX(5px) skewX(-3deg); }
    60% { transform: translateX(-2px); }
    100% { transform: translateX(0); filter: brightness(1); }
  }
  .content.glitch { animation: glitch 0.25s linear; }
</style>
</head>
<body>

<div class="stage">
  <div class="monitor">
    <div class="screen" id="screen">

          <div class="menu-title">Acceso concedido</div>
          <div class="menu-list" id="menu-list">
            <div class="opt" data-act="search">Buscar entrada</div>
            <div class="opt" data-act="hist">Historial</div>
          </div>
          <div class="pw-hint"><span class="kb">[&#9650;&#9660;] + [enter] or tap</span><span class="touch">tap to select</span></div>
        </div>

          <div class="txt-body" id="hist-body">
            <h1>Historial &mdash; <span id="hist-count"></span></h1>
            <div class="hist-list" id="hist-list"></div>
          </div>
          <div class="txt-hint" id="hist-hint">press [esc] or tap here to go back</div>
        </div>

        <!-- PANTALLA DE TEXTO -->
        <div class="view" id="view-txt">
          <div class="txt-body" id="txt-body"></div>
          <div class="txt-hint" id="txt-hint">press [esc] or tap here to go back</div>
        </div>

      </div>
    </div>
  </div>
</div>

<form id="pw-form" autocomplete="off">
  <input type="text" id="hidden" maxlength="24" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">

`[ TEXTO EXTRAÍDO DE TEATROCRÍTICA.COM.AR — SECCIÓN "RESEÑAS DE ESPECTADORES" ]
Usuario: pnigri_ | Obra: "Corona de Centeno" | Sala: Teatro del Abasto | Puntaje: 4/5

Voy a ser sincero: hasta hace un mes no me importaba nada de Polonia. No sabía ni dónde quedaba exactamente. Pero desde que un amigo se fue para allá (de un día para el otro, persiguiendo no sé qué historia familiar) me empecé a interesar, y entre eso y todo lo que está pasando en las noticias con el Reino Unido y las declaraciones raras que viene sacando Polonia, cuando vi el afiche de esta obra no lo dudé.

"Corona de Centeno" es, en apariencia, una obra sobre la historia de Polonia: reyes, particiones, guerras, el país que desaparece del mapa y vuelve a aparecer. Pero en realidad es una obra sobre lo que Polonia quiere ser, y eso es lo que la hace inquietante.

El centro de la obra es Juan III Sobieski, rey de Polonia, y su guerra con el Imperio Otomano. La primera parte lo muestra antes de la corona: un noble de frontera que ya había peleado contra los turcos y los conocía mejor que nadie, que sabía cuándo atacar y cuándo sentarse a negociar. Lo eligen rey justamente por eso. El actor que lo interpreta está muy bien: nunca levanta la voz, y aun así uno siente que está armando algo enorme detrás de escena. Hay un monólogo suyo, la noche antes de partir, sobre "las coronas que se rompen y las que se vuelven a forjar con pedazos de otras" que me quedó dando vueltas toda la noche. Con lo que se está hablando de Escocia y de Irlanda, no sé, me pareció demasiado actual para ser casualidad.

La segunda parte es la guerra en sí. Los otomanos avanzan sobre Viena, el emperador pide ayuda, y Sobieski cruza con su ejército para ir a defender una ciudad que ni siquiera es suya. La obra lo cuenta con pocos recursos pero mucha inteligencia: cañones lejanos, un coro que hace de ejército, mapas proyectados en el fondo. La escena de la carga de la caballería polaca desde las colinas, con los húsares alados bajando en fila, se resuelve con luz y sonido nada más, y aun así se me erizó la piel. Los turcos se retiran, Viena se salva, y Sobieski vuelve a casa como el hombre que frenó al Imperio Otomano. Pero la obra es más fina que eso: en el último cuadro de la guerra, un enviado otomano y Sobieski se sientan a comer pan en una mesa larguísima, y uno entiende que la guerra se ganó tanto en el campo como en esa mesa. Polonia siempre supo negociar cuando le convenía.

Y ahí aparece un panadero viejo, Joya, un polaco de manos enormes que, según la obra, inventó el bagel. Me pareció peculiar que nombraran eso, porque no tiene nada que ver con reyes ni con coronas, y sin embargo la obra le dedica una escena entera: Joya amasando en silencio, y después, cuando Sobieski vuelve de la guerra, Joya se le acerca entre la multitud y le entrega un pan con forma de anillo, sin decir una palabra. El rey lo toma como si fuera una corona. Es de lo mejor de la noche. No entendí del todo qué quiso decir el director con eso, pero me emocionó.

Después están los inmigrantes. Tres hermanos, o amigos, no queda claro, que siglos después se suben a un barco y cruzan el océano huyendo de todo: Mario, David y Abel. Tienen apellidos rarísimos que no llegué a entender, todos terminaban en "sky". Sus escenas en el barco son las más humanas de la obra: tienen miedo, se pelean, cantan. Uno de ellos guarda un papel doblado que nunca muestra y que le dieron antes de partir. Tampoco se explica.

La obra tiene sus defectos: es larga (dos horas y cuarto sin intervalo), y hay un par de escenas con el coro que sobran. Pero me gustó. Me gustó mucho. Salí con la sensación de haber visto algo que todavía no terminó de pasar.

Recomendada. Vayan antes de que la levanten, o antes de que la realidad la alcance.

Pedro Nigri`

`Universidad Jagellónica de Cracovia

Facultad de Matemática e Informática

Asunto: Solicitud de intercambio académico — segundo semestre 2027

Estimados miembros del comité:

Mi nombre es Lautaro Braslavski. Curso el cuarto año de la Licenciatura en Matemática en la Universidad de Buenos Aires y me dirijo a ustedes para solicitar una plaza de intercambio en su facultad durante el segundo semestre de 2027. No elijo Polonia como destino genérico: hay una razón puntual, con nombre y apellido, y quiero explicarla con honestidad.

Hace unos meses, revisando actas viejas de un congreso de análisis realizado en Lwów en 1934, encontré una comunicación breve, apenas dos páginas, firmada por un tal K. Sobieski, docente de su universidad. El título era casi modesto: "Sobre la difusión del calor en superficies cerradas de género uno". Nadie más en las actas lo cita. No aparece en ninguna historia de la escuela matemática polaca que haya podido consultar. Y sin embargo, lo que hay en esas dos páginas es, para mí, lo más interesante que leí en toda la carrera.

Sobieski estudiaba el toro. No como objeto abstracto, sino como un lugar donde pasan cosas físicas. Su pregunta era simple de enunciar y difícil de responder: si uno calienta un punto de un toro, ¿cómo se reparte ese calor por toda la superficie, y cuánto tarda en volverse uniforme? La ecuación del calor sobre una variedad compacta es un problema clásico, pero él insistía en que el toro tiene propiedades que lo hacen distinto de la esfera o del plano: la existencia de dos curvas cerradas independientes que no se pueden contraer, el hecho de que su curvatura cambia de signo (positiva en el borde exterior, negativa en el interior, cerca del agujero), y la manera en que esa geometría determina el espectro del laplaciano y, con él, los tiempos de enfriamiento. Sobieski sostenía que en el toro el calor "recuerda" la forma: que la parte interna, la que mira al agujero, se comporta de manera cualitativamente distinta a la externa, y que esa diferencia no es un detalle numérico sino una consecuencia directa de la topología.

Esto es exactamente el cruce que a mí me interesa: topología y ecuaciones diferenciales tratadas como una sola cosa. Cómo el número de agujeros de una superficie, un invariante puramente combinatorio, termina apareciendo en la solución de una ecuación en derivadas parciales. Cómo la geometría del toro condiciona no solo el calor sino también el flujo de fluidos sobre su superficie, la propagación de ondas, la distribución de tensiones cuando el material se expande. Sobieski apenas alcanzó a esbozar esto, y después su nombre desaparece. Quiero saber qué más escribió, si dejó cuadernos, si tuvo alumnos, y sobre todo quiero terminar el trabajo que él empezó con las herramientas que hoy tenemos.

Durante mi estadía me propongo cursar los seminarios de geometría diferencial y de ecuaciones en derivadas parciales de su facultad, consultar el archivo histórico de la universidad y de la Biblioteca Jagellónica en busca del resto de la obra de Sobieski, y trabajar bajo la orientación de algún docente del Departamento de Análisis que esté dispuesto a acompañar el proyecto. El resultado sería una monografía sobre su figura y sus aportes, que presentaría en mi universidad de origen y que aspiro a publicar.

Tengo un promedio de 10/10. He cursado Topología, Análisis Funcional, Ecuaciones Diferenciales y Geometría Diferencial con buenas calificaciones, y he sido ayudante de Análisis II durante dos cuatrimestres. Mi nivel de inglés es C1. Comencé a estudiar polaco hace cuatro meses, con el único objetivo de poder leer a Sobieski en su idioma.

Agradezco de antemano el tiempo dedicado a esta solicitud. Adjunto mi expediente académico, currículum, dos cartas de recomendación y una copia de las dos páginas de Sobieski, por si a alguien del comité le despiertan la misma curiosidad que a mí.

Atentamente,

Lautaro Braslavski
Licenciatura en Matemática — Universidad de Buenos Aires`

      const o = e.target.closest('.opt');
      if (o) setSel(opts().indexOf(o));
    });
  }

  // re pág / av pág / espacio / inicio / fin
  function pageScroll(e, el) {
    const page = el.clientHeight * 0.85;
    if (e.key === 'PageDown' || e.key === ' ') el.scrollTop += page;
    else if (e.key === 'PageUp') el.scrollTop -= page;
    else if (e.key === 'Home') el.scrollTop = 0;
    else if (e.key === 'End') el.scrollTop = el.scrollHeight;
    else return;
    e.preventDefault();
  }

  document.addEventListener('keydown', (e) => {
    if (mode === 'menu') {
      if (e.key === 'ArrowDown') { e.preventDefault(); setSel(sel + 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); setSel(sel - 1); }
      else if (e.key === 'Enter') { e.preventDefault(); activate(opts()[sel]); }
      return;
    }
    if (mode === 'hist') {
      // las flechas saltan entre entradas vistas; pasado el borde (o sin ninguna vista) scrollean
      const n = opts().length;
      if (e.key === 'ArrowDown') { e.preventDefault(); if (sel < n - 1) setSel(sel + 1); else histBody.scrollTop += 40; }
      else if (e.key === 'ArrowUp') { e.preventDefault(); if (sel > 0) setSel(sel - 1); else histBody.scrollTop -= 40; }
      else if (e.key === 'Enter') { e.preventDefault(); activate(opts()[sel]); }
      else if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); goMenu(); }
      else pageScroll(e, histBody);
      return;
    }
    if (e.key === 'Escape') {
      e.preventDefault();
      if (mode === 'txt') backFromText();
      else if (unlocked) goMenu();
      else { clearBuffer(); status.classList.remove('show'); }
      return;
    }
    if (mode === 'txt') {
      // permitir scroll con flechas en el texto
      if (e.key === 'ArrowDown') { e.preventDefault(); txtBody.scrollTop += 40; }
      else if (e.key === 'ArrowUp') { e.preventDefault(); txtBody.scrollTop -= 40; }
      else if (e.key === 'Backspace') { e.preventDefault(); backFromText(); }
      else pageScroll(e, txtBody);
      return;
    }
    // si el input perdió el foco, lo recuperamos para no perder la tecla
    if (document.activeElement !== hidden) focus();
  });

  // el input oculto es la única fuente de lo tipeado (teclado físico y del celu)
  hidden.addEventListener('input', () => {
    if (mode !== 'pw') { hidden.value = ''; return; }
    buffer = hidden.value.slice(0, MAX_LEN);
    render();
    status.classList.remove('show');
  });

  // Enter / "Ir" del teclado del celu envían el form
  document.getElementById('pw-form').addEventListener('submit', (e) => {
    e.preventDefault();
    if (mode === 'pw') submit();
  });

  // quien ya desbloqueó antes arranca directo en el menú
  document.getElementById('txt-hint').textContent = BACK_HINT;
  document.getElementById('hist-hint').textContent = BACK_HINT;
  updatePwHint();
  if (unlocked) goMenu();
</script>
</body>
</html>
